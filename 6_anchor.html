<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchor Tag / Hyper link</title>
</head>
<body>
    <h4>This is hyper link or Anchor Tag</h4>

</html>
