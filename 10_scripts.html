<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supersccripts/Subscript</title>
</head>
<body>
    <h3>This tag is used for mathematical and chemical equations</h3>
    <p>
        <big>(a+b)<sup>2</sup> = a<sup>2</sup> + 2ab + b<sup>2</sup></big>
    </p>
    <p>
        <big>CH<sub>4</sub> + 0<sub>4</sub> = H<sub>2</sub>O + CO<sub>2</sub></big>
    </p>
    
</body>
</html>
