<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact me Form</title>
</head>
<body>
    <form action="/contact-me.php">
        <label for="first_name">First Name</label>
        <input type="text" id="first_name">
        <br>
        <label for="last_name">Last Name</label>
        <input type="text" id="last_name">
        <br>
        <label for="email">Email</label>
        <input type="text" id="email" placeholder="@email.com" required="True">
        <br>
        <label for="phone">Phone</label>
        <input type="text" id="phone" placeholder="+91 0123456789" required="True">
        <br>
        <label for="submit_button"></label>
        <input type="submit" id="submit_button"> 
        <br>
    </form>

</body>
</html>
