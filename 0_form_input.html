<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Type: Date/file/color/range/button/submit/radio button/ check box/ select /Text area</title>
</head>
<body>
    <form action="/contact-me"></form>
    <label for="date">Date: </label>
    <input type="date" id="date">
    <br>
    <label for="">File</label>
    <input type="file">
    <br>
    <label for="">Color</label>
    <input type="color">
    <br>
    <label for="">Price</label>
    <input type="range">
    <br>
    <label for="">Button</label>
    <input type="button" value="poked">
    <br>
    <label for="">Submit</label>
    <input type="submit">
    <br>
    <label for="male">Male</label>
    <input type="radio" id="male" name="gender" value="Male">
    <br>
    <label for="female">Female</label>
    <input type="radio" id="female" name="gender" value="Female">
    <br>
    <label for="other">Other</label>
    <input type="radio" id="other" name="gender" value="Other">
    <br>
    <label for="python">Python</label>
    <input type="checkbox" id="python" name="computer_lang" value="Python">
    <br>
    <label for="html">HTML</label>
    <input type="checkbox" id="html" name="computer_lang" value="HTML">
    <br>
    <label for="c++">C++</label>
    <input type="checkbox" id="c++" name="computer_lang" value="C++">
    <br>
    <label for="javascript">JavaScript</label>
    <input type="checkbox" id="javascript" name="computer_lang" value="JavaScript">
    <br>
    <label for="fruits">Choose a fruits</label>
    <select name="fruits" id="fruits">
        <option value="apple">Apple</option>
        <option value="banana">Banana</option>
        <option value="cherry">Cherry</option>
    </select>
    <br>
    <textarea name="story" id="story" cols="30" rows="5">Please write a story!
    </textarea>
    <br>
</body>
</html>
